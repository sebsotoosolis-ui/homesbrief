<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · HomesBrief</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link rel="shortcut icon" href="/favicon.ico?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    .split { min-height: 100vh; display: grid; background: var(--sand); }
    .photo { position: relative; min-height: 240px; }
    .photo img { width: 100%; height: 100%; object-fit: cover; min-height: 240px; }
    .photo span {
      position: absolute; left: 28px; right: 28px; bottom: 28px; color: white;
      font-family: Fraunces, Palatino, Georgia, serif; font-weight: 600; font-size: clamp(32px, 4vw, 48px); max-width: 12ch; line-height: 1.05;
      letter-spacing: -0.03em; text-shadow: 0 10px 28px rgba(0,0,0,.4);
    }
    .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,13,18,.15), rgba(7,13,18,.55)); }
    .photo span { z-index: 1; }
    .panel { padding: 28px 7vw 72px; display: flex; flex-direction: column; justify-content: center; }
    .panel h1 { font-size: clamp(42px, 5vw, 60px); line-height: 1.02; margin: 8px 0 10px; }
    #sign-in { min-height: 320px; margin-top: 12px; }
    @media (min-width: 900px) {
      .split { grid-template-columns: 1.05fr .95fr; }
      .photo, .photo img { min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="split">
    <div class="photo">
      <img src="/demo/01.jpg" alt="" />
      <span>Tu portafolio de lujo, siempre a la mano.</span>
    </div>
    <div class="panel">
      <nav class="nav" style="position:static;padding:18px 0;background:transparent;border:0">
        <a class="logo" href="/"><img class="logo-mark" src="/logo.svg" alt="" />Homes<span>Brief</span></a>
        <a href="/registro">Regístrate</a>
      </nav>
      <div class="kicker">Tu cuenta</div>
      <h1>Iniciar sesión</h1>
      <p class="lead">La sesión se mantiene abierta en este dispositivo.</p>
      <div id="sign-in"></div>
      <p class="err" id="err"></p>
    </div>
  </div>
  <script src="/clerk-client.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/fichas';
    bootClerk(next).then((clerk) => {
      if (clerk.isSignedIn) {
        window.location.href = next;
        return;
      }
      clerk.mountSignIn(document.getElementById('sign-in'), {
        appearance: clerkAppearance,
        forceRedirectUrl: next,
        fallbackRedirectUrl: next,
        signUpUrl: '/registro?next=' + encodeURIComponent(next),
      });
    }).catch((error) => {
      document.getElementById('err').textContent = error.message;
      document.getElementById('err').classList.add('on');
    });
  </script>
</body>
</html>
