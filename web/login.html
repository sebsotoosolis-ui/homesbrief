<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · HomesBrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family: Manrope, sans-serif; background:#f3eee5; color:#14242e; }
    .nav { display:flex; justify-content:space-between; align-items:center; padding:18px 7vw; }
    .logo { font-family:"Cormorant Garamond", serif; font-size:26px; text-decoration:none; color:inherit; }
    .logo span { color:#c4a265; }
    main { width:min(460px, calc(100% - 40px)); margin: 20px auto 80px; background:#fffcf7; border-radius:24px; padding:32px; }
    h1 { font-family:"Cormorant Garamond", serif; font-size:36px; margin:0 0 8px; }
    p { color:#6b7880; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border-radius:14px; border:1px solid rgba(20,36,46,.12); font:inherit; box-sizing:border-box; }
    button { width:100%; margin-top:18px; border:0; background:#0c1820; color:white; border-radius:999px; padding:14px; font:inherit; font-weight:600; cursor:pointer; }
    a { color:#c4a265; }
  </style>
</head>
<body>
  <div class="nav"><a class="logo" href="/">Homes<span>Brief</span></a><a href="/registro">Regístrate</a></div>
  <main>
    <h1>Iniciar sesión</h1>
    <p>Entra para generar la siguiente ficha.</p>
    <form id="form">
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Contraseña</label>
      <input name="password" type="password" required />
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script>
    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault();
      const email = new FormData(event.target).get('email');
      const existing = JSON.parse(localStorage.getItem('homesbrief_user') || '{}');
      localStorage.setItem('homesbrief_user', JSON.stringify({ ...existing, email }));
      window.location.href = '/app';
    });
  </script>
</body>
</html>
