<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regístrate · HomesBrief</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="shortcut icon" href="/favicon.ico?v=3" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    .split { min-height: 100vh; display: grid; }
    @media (min-width: 900px) { .split { grid-template-columns: 1.05fr .95fr; } }
    .photo { display: none; position: relative; }
    @media (min-width: 900px) { .photo { display: block; } }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo span {
      position: absolute; left: 32px; bottom: 32px; color: white;
      font-family: "Cormorant Garamond", serif; font-size: 32px; max-width: 16ch; line-height: 1;
      text-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .panel { padding: 20px 7vw 64px; }
    #sign-up { min-height: 360px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="split">
    <div class="photo">
      <img src="/demo/08.jpg" alt="" />
      <span>Empieza gratis. Si tienes código de beta, canjéalo en la app.</span>
    </div>
    <div class="panel">
      <nav class="nav" style="position:static;padding:18px 0;background:transparent;border:0">
        <a class="logo" href="/"><img class="logo-mark" src="/logo.svg" alt="" />Homes<span>Brief</span></a>
        <a href="/login">Ya tengo cuenta</a>
      </nav>
      <h1 style="font-size:42px;margin:12px 0 8px">Crea tu cuenta</h1>
      <p class="lead">3 fichas de trial. Sin tarjeta. La sesión queda iniciada en este navegador.</p>
      <div id="sign-up"></div>
      <p class="err" id="err"></p>
    </div>
  </div>
  <script src="/clerk-client.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/app';
    bootClerk(next).then((clerk) => {
      if (clerk.isSignedIn) {
        window.location.href = next;
        return;
      }
      clerk.mountSignUp(document.getElementById('sign-up'), {
        appearance: clerkAppearance,
        forceRedirectUrl: next,
        fallbackRedirectUrl: next,
        signInUrl: '/login?next=' + encodeURIComponent(next),
      });
    }).catch((error) => {
      document.getElementById('err').textContent = error.message;
      document.getElementById('err').classList.add('on');
    });
  </script>
</body>
</html>
