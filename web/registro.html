<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regístrate · HomesBrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family: Manrope, sans-serif; background:#f3eee5; color:#14242e; }
    .nav { display:flex; justify-content:space-between; align-items:center; padding:18px 7vw; }
    .logo { font-family:"Cormorant Garamond", serif; font-size:26px; text-decoration:none; color:inherit; }
    .logo span { color:#c4a265; }
    main { width:min(480px, calc(100% - 40px)); margin: 20px auto 80px; background:#fffcf7; border-radius:24px; padding:32px; }
    h1 { font-family:"Cormorant Garamond", serif; font-size:36px; margin:0 0 8px; }
    p { color:#6b7880; }
    a { color:#c4a265; }
    #sign-up { min-height: 360px; }
    .err { color:#9b2c2c; }
  </style>
</head>
<body>
  <div class="nav"><a class="logo" href="/">Homes<span>Brief</span></a><a href="/login">Ya tengo cuenta</a></div>
  <main>
    <h1>Crea tu cuenta</h1>
    <p>Empieza con 3 fichas gratis. Sin tarjeta para el trial.</p>
    <div id="sign-up"></div>
    <p class="err" id="err"></p>
  </main>
  <script src="/clerk-client.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/app';
    bootClerk().then((clerk) => {
      if (clerk.isSignedIn) {
        window.location.href = next;
        return;
      }
      clerk.mountSignUp(document.getElementById('sign-up'), {
        appearance: clerkAppearance,
        afterSignUpUrl: next,
        signInUrl: '/login?next=' + encodeURIComponent(next),
      });
    }).catch((error) => {
      document.getElementById('err').textContent = error.message;
    });
  </script>
</body>
</html>
