<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regístrate · HomesBrief</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link rel="shortcut icon" href="/favicon.ico?v=4" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/brand.css" />
  <style>
    .split { min-height: 100vh; display: grid; }
    @media (min-width: 900px) { .split { grid-template-columns: 1.05fr .95fr; } }
    .photo { display: none; position: relative; }
    @media (min-width: 900px) { .photo { display: block; } }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .photo span {
      position: absolute; left: 32px; bottom: 32px; color: white;
      font-family: "Cormorant Garamond", serif; font-size: 32px; max-width: 16ch; line-height: 1;
      text-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .panel { padding: 20px 7vw 64px; }
    #sign-up { min-height: 360px; margin-top: 8px; }
    .name-hint { margin: 8px 0 0; font-size: 13px; color: #9b2c2c; font-weight: 600; }
    .name-hint[hidden] { display: none; }
    #given-name.missing { border-color: #9b2c2c; }
    .back-email {
      display: block; width: 100%; margin-top: 14px;
      border: 1px solid rgba(20, 36, 46, 0.18); background: white; color: var(--ink);
      border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .back-email[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="split">
    <div class="photo">
      <img src="/demo/08.jpg" alt="" />
      <span>Empieza gratis. Si tienes código de beta, canjéalo en la app.</span>
    </div>
    <div class="panel">
      <nav class="nav" style="position:static;padding:18px 0;background:transparent;border:0">
        <a class="logo" href="/"><img class="logo-mark" src="/logo.svg" alt="" />Homes<span>Brief</span></a>
        <a href="/login">Ya tengo cuenta</a>
      </nav>
      <h1 style="font-size:42px;margin:12px 0 8px">Crea tu cuenta</h1>
      <p class="lead">3 fichas de trial. Sin tarjeta. La sesión queda iniciada en este navegador.</p>
      <label for="given-name">Tu nombre</label>
      <input id="given-name" autocomplete="given-name" placeholder="ej: Camila" />
      <p class="name-hint" id="name-err" hidden>Escribe tu nombre para continuar.</p>
      <button type="button" class="back-email" id="back-email" hidden>Corregir correo</button>
      <div id="sign-up"></div>
      <p class="err" id="err"></p>
    </div>
  </div>
  <script src="/clerk-client.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/app';
    const given = document.getElementById('given-name');
    const nameErr = document.getElementById('name-err');
    const back = document.getElementById('back-email');
    const signUpEl = document.getElementById('sign-up');
    const examples = ['Camila', 'Diego', 'Renata', 'Mateo', 'Lucía', 'Andrés', 'Valeria', 'Emiliano'];
    given.placeholder = 'ej: ' + examples[Math.floor(Math.random() * examples.length)];
    const savedName = sessionStorage.getItem('homesbrief-name')?.trim() || '';
    if (savedName) given.value = savedName;

    const nameReady = () => given.value.trim().length >= 2;
    const saveName = () => {
      const value = given.value.trim();
      if (value) sessionStorage.setItem('homesbrief-name', value);
      else sessionStorage.removeItem('homesbrief-name');
      if (nameReady()) {
        nameErr.hidden = true;
        given.classList.remove('missing');
      }
    };
    const blockForName = (event) => {
      if (nameReady()) return;
      event.preventDefault();
      event.stopPropagation();
      nameErr.hidden = false;
      given.classList.add('missing');
      given.focus();
    };
    given.addEventListener('input', saveName);
    given.addEventListener('change', saveName);
    signUpEl.addEventListener('submit', blockForName, true);
    signUpEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') blockForName(event);
    }, true);
    signUpEl.addEventListener('click', (event) => {
      if (nameReady()) return;
      if (!event.target.closest('.cl-formButtonPrimary')) return;
      blockForName(event);
    }, true);

    const verifyingEmail = () => Boolean(signUpEl.querySelector(
      '[data-localization-key="signUp.emailCode.title"], [data-localization-key="signUp.emailLink.title"], .cl-identityPreviewEditButton'
    ));
    const syncBack = () => { back.hidden = !verifyingEmail(); };
    new MutationObserver(syncBack).observe(signUpEl, { childList: true, subtree: true });
    back.addEventListener('click', () => {
      const edit = signUpEl.querySelector('.cl-identityPreviewEditButton, button[aria-label="Edit email address"]');
      if (edit) edit.click();
    });

    bootClerk(next).then((clerk) => {
      if (clerk.isSignedIn) {
        window.location.href = next;
        return;
      }
      clerk.mountSignUp(document.getElementById('sign-up'), {
        appearance: clerkAppearance,
        forceRedirectUrl: next,
        fallbackRedirectUrl: next,
        signInUrl: '/login?next=' + encodeURIComponent(next),
      });
    }).catch((error) => {
      document.getElementById('err').textContent = error.message;
      document.getElementById('err').classList.add('on');
    });
  </script>
</body>
</html>
